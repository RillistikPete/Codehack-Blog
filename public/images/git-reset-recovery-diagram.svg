<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6675"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8b0b9"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7ab8"/>
    </marker>
  </defs>

  <!-- background: change fill to "none" for a transparent diagram -->
  <rect width="820" height="700" fill="#ffffff"/>

  <!-- ============ PANEL 1 ============ -->
  <rect x="20" y="20" width="780" height="195" rx="6" fill="#fbfcfd" stroke="#d6dde4"/>
  <text x="40" y="48" font-size="15" font-weight="600" fill="#2f3944">Before the reset</text>

  <circle cx="120" cy="160" r="20" fill="#9ed3a8" stroke="#5a9c68" stroke-width="1.5"/>
  <circle cx="230" cy="160" r="20" fill="#9ed3a8" stroke="#5a9c68" stroke-width="1.5"/>
  <line x1="142" y1="160" x2="208" y2="160" stroke="#5a6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="255" y="165" font-size="13" fill="#2f3944">HEAD &#8594; master</text>
  <text x="120" y="196" font-size="11" fill="#7b8794" text-anchor="middle">"first"</text>
  <text x="230" y="196" font-size="11" fill="#7b8794" text-anchor="middle">"omg"</text>

  <rect x="440" y="70" width="120" height="40" rx="5" fill="#cfe6f7" stroke="#3d7ab8" stroke-width="1.5"/>
  <text x="500" y="95" font-size="13" fill="#1d3f5e" text-anchor="middle">tree</text>

  <rect x="600" y="60" width="80" height="22" rx="3" fill="#e6f1fa" stroke="#3d7ab8"/>
  <text x="640" y="76" font-size="11" fill="#1d3f5e" text-anchor="middle">blob</text>
  <rect x="600" y="90" width="80" height="22" rx="3" fill="#e6f1fa" stroke="#3d7ab8"/>
  <text x="640" y="106" font-size="11" fill="#1d3f5e" text-anchor="middle">blob</text>
  <rect x="600" y="120" width="80" height="22" rx="3" fill="#e6f1fa" stroke="#3d7ab8"/>
  <text x="640" y="136" font-size="11" fill="#1d3f5e" text-anchor="middle">blob</text>

  <line x1="562" y1="88" x2="596" y2="71" stroke="#3d7ab8" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <line x1="562" y1="90" x2="596" y2="101" stroke="#3d7ab8" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <line x1="562" y1="95" x2="596" y2="131" stroke="#3d7ab8" stroke-width="1.4" marker-end="url(#arrowBlue)"/>

  <text x="440" y="135" font-size="12" fill="#3d7ab8" font-weight="600">index (git add)</text>
  <text x="440" y="152" font-size="11.5" fill="#7b8794">staged, never committed</text>

  <!-- ============ PANEL 2 ============ -->
  <rect x="20" y="240" width="780" height="195" rx="6" fill="#fbfcfd" stroke="#d6dde4"/>
  <text x="40" y="268" font-size="15" font-weight="600" fill="#2f3944">After</text>
  <text x="88" y="268" font-size="14" font-family="monospace" fill="#b03030">git reset --hard</text>

  <circle cx="120" cy="380" r="20" fill="#9ed3a8" stroke="#5a9c68" stroke-width="1.5"/>
  <circle cx="230" cy="380" r="20" fill="#9ed3a8" stroke="#5a9c68" stroke-width="1.5"/>
  <line x1="142" y1="380" x2="208" y2="380" stroke="#5a6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="255" y="385" font-size="13" fill="#2f3944">HEAD &#8594; master</text>
  <text x="255" y="403" font-size="11.5" fill="#5a9c68">commits untouched</text>

  <rect x="440" y="290" width="120" height="40" rx="5" fill="#eceff1"
        stroke="#a8b0b9" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="500" y="315" font-size="13" fill="#6b7580" text-anchor="middle">tree</text>

  <rect x="600" y="280" width="80" height="22" rx="3" fill="#f2f4f5" stroke="#a8b0b9" stroke-dasharray="4 3"/>
  <text x="640" y="296" font-size="11" fill="#6b7580" text-anchor="middle">blob</text>
  <rect x="600" y="310" width="80" height="22" rx="3" fill="#f2f4f5" stroke="#a8b0b9" stroke-dasharray="4 3"/>
  <text x="640" y="326" font-size="11" fill="#6b7580" text-anchor="middle">blob</text>
  <rect x="600" y="340" width="80" height="22" rx="3" fill="#f2f4f5" stroke="#a8b0b9" stroke-dasharray="4 3"/>
  <text x="640" y="356" font-size="11" fill="#6b7580" text-anchor="middle">blob</text>

  <line x1="562" y1="308" x2="596" y2="291" stroke="#a8b0b9" stroke-width="1.4" marker-end="url(#arrowGrey)"/>
  <line x1="562" y1="310" x2="596" y2="321" stroke="#a8b0b9" stroke-width="1.4" marker-end="url(#arrowGrey)"/>
  <line x1="562" y1="315" x2="596" y2="351" stroke="#a8b0b9" stroke-width="1.4" marker-end="url(#arrowGrey)"/>

  <text x="440" y="355" font-size="12" font-weight="600" fill="#6b7580">nothing points here</text>
  <text x="440" y="372" font-size="11.5" fill="#7b8794">still in .git/objects &#8212; not deleted</text>
  <text x="440" y="389" font-size="11.5" fill="#b03030">git gc would remove it</text>

  <!-- ============ PANEL 3 ============ -->
  <rect x="20" y="460" width="780" height="215" rx="6" fill="#fbfcfd" stroke="#d6dde4"/>
  <text x="40" y="488" font-size="15" font-weight="600" fill="#2f3944">After</text>
  <text x="88" y="488" font-size="14" font-family="monospace" fill="#3d7ab8">git commit-tree</text>

  <circle cx="120" cy="600" r="20" fill="#9ed3a8" stroke="#5a9c68" stroke-width="1.5"/>
  <circle cx="230" cy="600" r="20" fill="#9ed3a8" stroke="#5a9c68" stroke-width="1.5"/>
  <line x1="142" y1="600" x2="208" y2="600" stroke="#5a6675" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="255" y="605" font-size="13" fill="#2f3944">HEAD &#8594; master</text>

  <circle cx="340" cy="520" r="22" fill="#cfe6f7" stroke="#3d7ab8" stroke-width="2"/>
  <text x="340" y="484" font-size="12.5" font-weight="600" fill="#1d3f5e" text-anchor="middle">recovered</text>
  <line x1="340" y1="497" x2="340" y2="491" stroke="#3d7ab8" stroke-width="1.4"/>

  <rect x="440" y="500" width="120" height="40" rx="5" fill="#cfe6f7" stroke="#3d7ab8" stroke-width="1.5"/>
  <text x="500" y="525" font-size="13" fill="#1d3f5e" text-anchor="middle">tree</text>
  <line x1="364" y1="520" x2="434" y2="520" stroke="#3d7ab8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <rect x="600" y="490" width="80" height="22" rx="3" fill="#e6f1fa" stroke="#3d7ab8"/>
  <text x="640" y="506" font-size="11" fill="#1d3f5e" text-anchor="middle">blob</text>
  <rect x="600" y="520" width="80" height="22" rx="3" fill="#e6f1fa" stroke="#3d7ab8"/>
  <text x="640" y="536" font-size="11" fill="#1d3f5e" text-anchor="middle">blob</text>
  <rect x="600" y="550" width="80" height="22" rx="3" fill="#e6f1fa" stroke="#3d7ab8"/>
  <text x="640" y="566" font-size="11" fill="#1d3f5e" text-anchor="middle">blob</text>

  <line x1="562" y1="518" x2="596" y2="501" stroke="#3d7ab8" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <line x1="562" y1="520" x2="596" y2="531" stroke="#3d7ab8" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <line x1="562" y1="525" x2="596" y2="561" stroke="#3d7ab8" stroke-width="1.4" marker-end="url(#arrowBlue)"/>

  <text x="340" y="600" font-size="11.5" fill="#7b8794">a branch now references the</text>
  <text x="340" y="617" font-size="11.5" fill="#7b8794">orphaned tree &#8212; safe from gc</text>

</svg>
